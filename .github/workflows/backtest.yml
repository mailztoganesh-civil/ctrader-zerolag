name: Backtest Zero Lag rules

on:
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: EURUSD grid
        run: |
          for cfg in "0 5 2" "0.9 5 2" "0.9 10 2" "0.9 15 2" "0.9 10 1.5" "0.9 15 3"; do
            set -- $cfg
            echo "##### cost=$1 pip, minSL=$2 pips, RR=$3"
            BT_SYMBOL=EURUSD=X BT_COST=$1 BT_MINSL=$2 BT_RR=$3 python3 backtest/bt.py | grep -E "A |D |E "
          done
