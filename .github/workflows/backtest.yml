name: Backtest Zero Lag rules

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: EURUSD summary
        run: BT_SYMBOL=EURUSD=X python3 backtest/bt.py
      - name: Sample trades (last ~27h)
        run: BT_SYMBOL=EURUSD=X BT_DUMP=backtest/sample_eurusd.json python3 backtest/bt.py
      - name: Sample trades, old rules
        run: BT_SYMBOL=EURUSD=X BT_VARIANT=old BT_DUMP=backtest/sample_eurusd_old.json python3 backtest/bt.py
      - name: Commit sample
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add backtest/sample_eurusd.json backtest/sample_eurusd_old.json
          git diff --cached --quiet || git commit -m "Backtest sample [skip ci]"
          git push
