name: Backtest filters and timeframes

on:
  workflow_dispatch:
    inputs:
      script:
        default: bt2.py

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Study
        run: python3 backtest/${{ github.event.inputs.script || 'bt2.py' }}
