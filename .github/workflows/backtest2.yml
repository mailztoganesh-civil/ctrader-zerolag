name: Backtest filters and timeframes

on:
  workflow_dispatch:
    inputs:
      script:
        default: bt2.py
      h1:
        default: ''
      dump:
        default: ''

permissions:
  contents: write

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Study
        run: BT_DUMP='${{ github.event.inputs.dump }}' BT_H1='${{ github.event.inputs.h1 }}' python3 backtest/${{ github.event.inputs.script || 'bt2.py' }}
      - name: Commit dump
        if: ${{ github.event.inputs.dump != '' }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add "${{ github.event.inputs.dump }}"
          git diff --cached --quiet || git commit -m "Backtest dump [skip ci]"
          git push
