name: Build cBot (.algo)

on:
  push:
    paths-ignore:
      - 'release/**'
      - 'alerts/**'
      - 'backtest/**'
      - '.github/workflows/backtest.yml'
      - '.github/workflows/backtest2.yml'
      - '.github/workflows/duka.yml'
      - '.github/workflows/whatsapp-alerts.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            8.0.x

      - name: Build each bot and collect its .algo
        shell: bash
        run: |
          mkdir -p out
          for proj in ZeroLagTrendBot AsianBreakoutBot EmaCrossBot; do
            find . -name "*.algo" -not -path "./out/*" -not -path "./release/*" -delete
            dotnet build $proj/$proj.csproj -c Release
            f=$(find . -name "*.algo" -not -path "./out/*" -not -path "./release/*" | head -1)
            echo "$proj -> $f"
            cp "$f" "out/$proj.algo"
          done
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: cbots-algo
          path: out/*.algo
          if-no-files-found: error

      - name: Commit .algo to repo (release folder)
        shell: bash
        run: |
          mkdir -p release
          cp out/*.algo release/
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add release
          git diff --cached --quiet || git commit -m "Build .algo [skip ci]"
          git push
