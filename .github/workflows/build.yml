name: Build cBot (.algo)

on:
  push:
    paths-ignore:
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            8.0.x

      - name: Build
        run: dotnet build ZeroLagTrendBot/ZeroLagTrendBot.csproj -c Release

      - name: Collect .algo
        shell: bash
        run: |
          mkdir -p out
          find . -name "*.algo" -not -path "./out/*" -exec cp {} out/ \;
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: ZeroLagTrendBot-algo
          path: out/*.algo
          if-no-files-found: error

      - name: Commit .algo to repo (release folder)
        shell: bash
        run: |
          mkdir -p release
          cp out/*.algo release/
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add release
          git diff --cached --quiet || git commit -m "Build .algo [skip ci]"
          git push
