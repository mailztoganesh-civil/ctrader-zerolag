name: Download Dukascopy data

on:
  workflow_dispatch:
    inputs:
      sym:
        default: EURUSD
      days:
        default: '730'

permissions:
  contents: write

jobs:
  dl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: DUKA_SYM=${{ github.event.inputs.sym }} DUKA_DAYS=${{ github.event.inputs.days }} DUKA_OUT=backtest/data/${{ github.event.inputs.sym }}_m5_${{ github.event.inputs.days }}d.csv.gz python3 backtest/duka.py
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add backtest/data
          git diff --cached --quiet || git commit -m "Dukascopy data [skip ci]"
          git pull --rebase -q && git push
