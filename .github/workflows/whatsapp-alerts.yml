name: Zero Lag alerts (Telegram / WhatsApp)

on:
  schedule:
    - cron: "*/5 * * * 0-5"   # every 5 min, Sun-Fri (UTC); forex is closed Saturday
  workflow_dispatch:

concurrency:
  group: zerolag-alerts
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Restore last-run state
        uses: actions/cache/restore@v4
        with:
          path: alerts/state.json
          key: zerolag-state-${{ github.run_id }}
          restore-keys: zerolag-state-

      - name: Check signals and send alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 alerts/zerolag_alert.py

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: alerts/state.json
          key: zerolag-state-${{ github.run_id }}
